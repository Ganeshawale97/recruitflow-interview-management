name: RecruitFlow CI

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recruitflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package.json
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  backend-check:
    name: Backend syntax and dependency check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/backend/package.json
      - name: Install dependencies
        run: npm install
      - name: Check backend JavaScript syntax
        run: node --check server.js
